        #panel {
            position: fixed;
            width: 100vw;
            height: 100vh;

    <div id="panel" style="display:none">
        <div id="infopanel" style="max-width: 50vw; max-height: 50vh; overflow: auto; border: solid 2px rgb(192, 192, 192); background-color: #1f1f1f;padding:1ch">

        </div>

    <div style="display:flex;flex-direction:column">
        <h1>
            IL Hook Viewer
        </h1>
        <h2 id="info">
            <a href="#">Info</a>
        </h2>
        <script>
            let r = false
            let panel = document.getElementById('panel')
            panel.onclick = () => panel.style.display = 'none'
            document.getElementById("infopanel").onclick = (event) => {
                event.stopPropagation()
            }
            document.getElementById("info").onclick = async () => {
                if (r == true) {
                    return
                }
                r = true
                let ht = await fetch("/version")
                let json = await ht.json()
                let d = document.getElementById("panel")
                d.style.display = null
                let p = document.getElementById("infopanel")
                p.innerHTML = ""
                if (json.info != null) {
                    let a = document.createElement("div")
                    a.innerText = json.info
                    p.appendChild(a)
                }
                let a = document.createElement("div")
                a.innerText = "server starts running at " + new Date(json.time).toLocaleString()
                p.appendChild(a)

                let js = json.mods
                for (var i = 0; i < js.length; i++) {
                    let a = document.createElement("div")
                    let j = js[i]
                    a.innerText = j.name + "  " + j.version
                    p.appendChild(a)
                }
                r = false
            }
        </script>
        <h2>
            Method:
        </h2>
        <select id="selector" style="max-width:fit-content">
        </select>
        <div id="msg" style="color: yellow">

        </div>
        <div id="hook" style="display:flex;flex-direction:column;overflow-x:auto;padding-bottom:1.5ch">

        </div>
        <button id="refresh" style="display: none;width:fit-content">
            refresh
        </button>
        <pre id="il" style="display:flex;flex-direction:column;overflow-x:auto">

        </pre>
        <pre id="decom" style="display:flex;flex-direction:column;overflow-x:auto">

        </pre>

    </div>
    <script async>
        async function main() {
            let sel = document.getElementById("selector")
            let opt = document.createElement("option")
            opt.innerText = "please select"
            sel.appendChild(opt)
            let list = await fetch("/list")
            let ll = await list.json()
            ll = ll.map((r, i) => [r, i]).sort((x, y) => x[0] < y[0] ? -1 : x[0] == y[0] ? 0 : 1)
            let c = []
            for (var i = 0; i < ll.length; i++) {
                let ai = ll[i][1]
                let name = ll[i][0]
                let op = document.createElement("option")
                op.value = i
                op.innerText = name
                sel.appendChild(op)
            }
            async function onch(ai) {
                let name = ll[ai][0]
                let msg = document.getElementById("msg")
                msg.innerHTML = ""
                msg.innerText = "working..."

                let check = Array.from(document.querySelectorAll("#hook .ilhookfilter")).filter(u => !u.checked).map(u => u.value)

                let h = await fetch("/method", {
                    body: JSON.stringify({
                        hint: ai,
                        name: name,
                        disabled: check,
                    }),
                    method: "POST",
                })
                let button = document.getElementById("refresh")
                button.style.display = "none"

                let js = await h.json()
                let dd = document.getElementById("decom")
                dd.innerHTML = ""
                let il = document.getElementById("il")
                il.innerHTML = ""
                let hook = document.getElementById("hook")
                hook.innerHTML = ""

                msg.innerText = js.message.join("\n")

                let ons = js.ons
                for (var i = 0; i < ons.length; i++) {
                    let p = document.createElement("div")
                    p.innerText = "On: " + ons[i]
                    hook.appendChild(p)
                }
                ons = js.ils
                for (var i = 0; i < ons.length; i++) {
                    let p = document.createElement("div")
                    let c = document.createElement("input")
                    let l = document.createElement("label")

                    let s = ons[i].name
                    let d = ons[i].disabled
                    c.type = "checkbox"
                    c.value = s
                    c.className = "ilhookfilter"
                    c.id = `${i}_${s}`
                    c.checked = !d
                    l.htmlFor = c.id
                    l.innerText = "IL: " + s
                    p.appendChild(c)
                    p.appendChild(l)
                    hook.appendChild(p)
                }
                if (js.ils.length == 0) {
                    return
                }
                button.style.display = null

                let diff = js.diff
                for (var i = 0; i < diff.length; i++) {
                    let instr = diff[i];
                    let main = document.createElement("div")
                    il.appendChild(main)
                    main.id = `il_${instr.offset}`

                    let ins = document.createElement("span")
                    let f = instr.flag
                    let s = " "
                    if (f.includes("r") && f.includes("a")) {
                        ins.className = "crossed"
                        if (f.includes("o")) {
                            s = "-"
                        } else {
                            s = "+"
                        }
                    } else {
                        if (f.includes("a")) {
                            ins.className = "added"
                            s = "+"
                        }
                        if (f.includes("r")) {
                            ins.className = "removed"
                            s = "-"
                        }
                    }
                    ins.innerText = `${s} ${instr.instr}`
                    main.appendChild(ins)

                    let src = instr.src
                    if (src.length > 0) {
                        let then = document.createElement("span")
                        then.className = "instr"
                        then.innerText = src.map(s => " @ " + s).join("")
                        main.appendChild(then)
                    }

                    let bind = instr.bound
                    if (bind != null) {
                        let doc = document.createElement("div")
                        doc.className = "bind"
                        doc.innerText = "    |> " + bind
                        il.appendChild(doc)
                    }
                    let brea = instr.break
                    if (brea != null && brea.length > 0) {
                        let doc = document.createElement("div")
                        doc.className = "bind"
                        let sp1 = document.createElement("span")
                        sp1.innerText = "    => "
                        doc.appendChild(sp1)
                        for (var j = 0; j < brea.length; j++) {
                            let o = brea[j]
                            let label = document.createElement("a")
                            let raw = o.toString(16)
                            while (raw.length < 4) {
                                raw = "0" + raw
                            }
                            label.innerText = "IL_" + raw + " "
                            label.href = `#il_${o}`
                            doc.appendChild(label)

                            let tar
                            label.onmouseover = () => {
                                tar ??= document.getElementById(`il_${o}`)
                                tar.classList.add("highlight")
                            }
                            label.onmouseleave = () => {
                                tar ??= document.getElementById(`il_${o}`)
                                tar.classList.remove("highlight")
                            }
                        }
                        il.appendChild(doc)
                    }
                }

                let decom = js.decompile
                if (decom != null) {
                    for (var i = 0; i < decom.length; i++) {
                        let line = document.createElement("div")
                        dd.appendChild(line)
                        let lc = decom[i]
                        for (var j = 0; j < lc.length; j++) {
                            let token = lc[j]
                            let w = document.createElement("span")
                            if (token.color != null) {
                                w.className = token.color
                            }
                            w.innerText = token.token
                            line.appendChild(w)
                        }
                    }
                }
            }
            sel.onchange = event => onch(Number(event.target.value))
            document.getElementById("refresh").onclick = event => {
                onch(Number(sel.value))
            }
        }
        main()
    </script>
